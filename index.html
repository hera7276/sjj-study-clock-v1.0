<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SJJ STUDY CLOCK</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #FFFDF7 0%, #F5F7FB 100%);
      color: #1E293B;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: pan-y;
      overscroll-behavior: none;
    }

    /* 귀여운 은은한 파스텔 도트 배경 패턴 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#CBD5E1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* 뷰포트 슬라이더 트랙 */
    #sliderTrack {
      display: flex;
      width: 200vw;
      height: 100%;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sliderTrack.dragging {
      transition: none !important;
    }

    .slide-page {
      width: 100vw;
      height: 100%;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 실물 타임타이머 하드웨어 케이스 스타일링 */
    .timer-hardware-box {
      background: #FFFFFF;
      box-shadow: 
        0 18px 36px -10px rgba(245, 158, 11, 0.15),
        0 10px 24px -6px rgba(15, 23, 42, 0.08),
        inset 0 3px 6px rgba(255, 255, 255, 1),
        inset 0 -3px 6px rgba(226, 232, 240, 0.7);
      border: 5px solid #F8FAFC;
    }

    .timer-inner-bezel {
      box-shadow: 
        inset 0 4px 10px rgba(0, 0, 0, 0.07),
        inset 0 1px 3px rgba(0, 0, 0, 0.05),
        0 1px 2px rgba(255, 255, 255, 1);
    }

    /* 다이얼 조작 전용 인터랙션 */
    .dial-surface {
      cursor: grab;
      touch-action: none;
    }
    .dial-surface:active {
      cursor: grabbing;
    }

    /* 댕댕이 모션 애니메이션 */
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes pencilWrite {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(3px, -2px) rotate(4deg); }
      75% { transform: translate(-2px, 1px) rotate(-3deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes eyeBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
    .anim-ear-l { transform-origin: 32px 36px; animation: earWiggle 3.2s ease-in-out infinite; }
    .anim-ear-r { transform-origin: 78px 36px; animation: earWiggle 3.2s ease-in-out infinite reverse; }
    .anim-hand-write { transform-origin: 75px 82px; animation: pencilWrite 0.9s ease-in-out infinite; }
    .anim-tail { transform-origin: 22px 88px; animation: tailWag 0.65s ease-in-out infinite; }
    .anim-blink { transform-origin: 50% 50%; animation: eyeBlink 4s infinite; }

    /* 쉬는 시간 댄스 강아지 애니메이션 */
    @keyframes danceGroove {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-7px) rotate(-3deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes speakerThump {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }
    @keyframes musicFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px) scale(1.15) rotate(14deg); }
    }
    .anim-dance { animation: danceGroove 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 55px 95px; }
    .anim-speaker { animation: speakerThump 0.55s ease-in-out infinite; transform-origin: 20px 85px; }
    .note-1 { animation: musicFloat 2.2s infinite ease-out; }
    .note-2 { animation: musicFloat 2.2s infinite 0.7s ease-out; }
    .note-3 { animation: musicFloat 2.2s infinite 1.4s ease-out; }

    /* 토스트 알림 */
    #toastNotice {
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    /* 가로 모드 (Landscape) 레이아웃 대응 */
    @media (orientation: landscape) and (max-height: 580px) {
      .landscape-layout {
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 1.5rem !important;
        padding-top: 0.25rem !important;
        padding-bottom: 0.25rem !important;
      }
      .landscape-hide {
        display: none !important;
      }
    }
  </style>
</head>

  <!-- 하단 페이지 인디케이터 도트 -->

  <script>
    /* ==============================================================
     * 1. 전역 상태 및 타이머 변수 관리
     * ============================================================== */
    let currentMode = 'study'; // 'study' 또는 'break'
    let studyMinutes = 25;     // 기본 공부 시간 (25분)
    let breakMinutes = 5;      // 기본 쉬는 시간 (5분)
    let timerDuration = 25 * 60; // 초 단위 전체 시간
    let timeLeft = timerDuration; // 초 단위 남은 시간
    let isRunning = false;
    let timerInterval = null;
    let soundEnabled = true;

    // DOM 요소 캐싱
    const sliderTrack = document.getElementById('sliderTrack');
    const navBtnClock = document.getElementById('navBtnClock');
    const navBtnTimer = document.getElementById('navBtnTimer');
    const dot0 = document.getElementById('dot0');
    const dot1 = document.getElementById('dot1');
    const headerModeBadge = document.getElementById('headerModeBadge');

    // 시계 화면 요소
    const fullDateText = document.getElementById('fullDateText');
    const bigClockText = document.getElementById('bigClockText');
    const clockStatusSub = document.getElementById('clockStatusSub');
    const clockStatusIndicatorDot = document.getElementById('clockStatusIndicatorDot');
    const clockDogStudy = document.getElementById('clockDogStudy');
    const clockDogBreak = document.getElementById('clockDogBreak');

    // 타이머 화면 요소
    const timerDogStudy = document.getElementById('timerDogStudy');
    const timerDogBreak = document.getElementById('timerDogBreak');
    const tabBtnStudy = document.getElementById('tabBtnStudy');
    const tabBtnBreak = document.getElementById('tabBtnBreak');
    const visualTimerDisk = document.getElementById('visualTimerDisk');
    const dialGuideDot = document.getElementById('dialGuideDot');
    const knobPointerLine = document.getElementById('knobPointerLine');
    const digitalTimeText = document.getElementById('digitalTimeText');
    const labelModeTitle = document.getElementById('labelModeTitle');
    const btnStartPause = document.getElementById('btnStartPause');
    const startIcon = document.getElementById('startIcon');
    const startText = document.getElementById('startText');
    const analogDialSvg = document.getElementById('analogDialSvg');

    /* ==============================================================
     * 2. Web Audio API 효과음 엔진
     * ============================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', volume = 0.15) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio play prevented', e);
      }
    }

    function soundTick() { playTone(980, 0.04, 'triangle', 0.08); }
    function soundStart() { playTone(523.25, 0.1, 'sine', 0.15); setTimeout(() => playTone(659.25, 0.15, 'sine', 0.15), 100); }
    function soundPause() { playTone(440, 0.1, 'sine', 0.12); }
    function soundComplete() {
      const melody = [523.25, 659.25, 783.99, 1046.50];
      melody.forEach((f, idx) => {
        setTimeout(() => playTone(f, 0.35, 'triangle', 0.2), idx * 140);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.textContent = soundEnabled ? '🔊' : '🔇';
      showToast(soundEnabled ? '효과음이 켜졌습니다.' : '효과음이 꺼졌습니다.');
    }

    /* ==============================================================
     * 3. 아날로그 다이얼 눈금 및 숫자 생성 (사진 완전 일치)
     * ============================================================== */
    function initAnalogDialFace() {
      const tickGroup = document.getElementById('dialTickMarks');
      const numGroup = document.getElementById('dialNumbersGroup');
      tickGroup.innerHTML = '';
      numGroup.innerHTML = '';

      const cx = 100;
      const cy = 100;
      const radius = 76;

      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * (Math.PI / 180);
        const is5Min = (i % 5 === 0);
        const innerR = is5Min ? radius - 9 : radius - 5;
        const strokeW = is5Min ? 2.4 : 1.1;
        const color = is5Min ? '#0F172A' : '#64748B';

        const x1 = cx + (radius * Math.sin(angle));
        const y1 = cy - (radius * Math.cos(angle));
        const x2 = cx + (innerR * Math.sin(angle));
        const y2 = cy - (innerR * Math.cos(angle));

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', strokeW);
        tickGroup.appendChild(line);

        if (is5Min) {
          const numR = radius - 18;
          const nx = cx + (numR * Math.sin(angle));
          const ny = cy - (numR * Math.cos(angle));

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', nx);
          text.setAttribute('y', ny);
          text.textContent = String(i);

          text.style.cursor = 'pointer';
          text.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            setDirectPreset(i === 0 ? 60 : i);
          });

          numGroup.appendChild(text);
        }
      }
    }

    /* ==============================================================
     * 4. 실시간 현재 시계 (Page 1)
     * ============================================================== */
    function updateLiveClock() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const day = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      fullDateText.textContent = `${year}. ${month}. ${date} (${day})`;
      bigClockText.textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    /* ==============================================================
     * 5. 스와이프 슬라이더 (터치 & 드래그)
     * ============================================================== */
    let currentSlide = 0;
    let swipeStartX = 0;
    let swipeDeltaX = 0;
    let isSwiping = false;

    function goToSlide(index) {
      currentSlide = Math.max(0, Math.min(1, index));
      sliderTrack.style.transform = `translateX(-${currentSlide * 100}vw)`;

      if (currentSlide === 0) {
        navBtnClock.className = 'px-3 py-1 text-xs font-black rounded-xl transition-all bg-amber-400 text-slate-900 shadow-sm';
        navBtnTimer.className = 'px-3 py-1 text-xs font-bold rounded-xl transition-all text-slate-500 hover:text-slate-900';
        dot0.className = 'w-6 h-2 rounded-full bg-amber-400 cursor-pointer transition-all shadow-sm';
        dot1.className = 'w-2 h-2 rounded-full bg-slate-300 cursor-pointer transition-all';
      } else {
        navBtnClock.className = 'px-3 py-1 text-xs font-bold rounded-xl transition-all text-slate-500 hover:text-slate-900';
        navBtnTimer.className = 'px-3 py-1 text-xs font-black rounded-xl transition-all bg-amber-400 text-slate-900 shadow-sm';
        dot0.className = 'w-2 h-2 rounded-full bg-slate-300 cursor-pointer transition-all';
        dot1.className = 'w-6 h-2 rounded-full bg-amber-400 cursor-pointer transition-all shadow-sm';
      }
    }

    sliderTrack.addEventListener('touchstart', (e) => {
      if (e.target.closest('button') || e.target.closest('#analogDialSvg')) return;
      swipeStartX = e.touches[0].clientX;
      swipeDeltaX = 0;
      isSwiping = true;
      sliderTrack.classList.add('dragging');
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isSwiping) return;
      swipeDeltaX = e.touches[0].clientX - swipeStartX;
      let offset = -currentSlide * window.innerWidth + swipeDeltaX;
      if (offset > 0) offset *= 0.2;
      if (offset < -1 * window.innerWidth) offset = -1 * window.innerWidth + (offset + window.innerWidth) * 0.2;
      sliderTrack.style.transform = `translateX(${offset}px)`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isSwiping) return;
      isSwiping = false;
      sliderTrack.classList.remove('dragging');
      const threshold = window.innerWidth * 0.16;
      if (swipeDeltaX < -threshold && currentSlide < 1) goToSlide(1);
      else if (swipeDeltaX > threshold && currentSlide > 0) goToSlide(0);
      else goToSlide(currentSlide);
      swipeDeltaX = 0;
    });

    sliderTrack.addEventListener('mousedown', (e) => {
      if (e.target.closest('button') || e.target.closest('#analogDialSvg')) return;
      swipeStartX = e.clientX;
      swipeDeltaX = 0;
      isSwiping = true;
      sliderTrack.classList.add('dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isSwiping) return;
      swipeDeltaX = e.clientX - swipeStartX;
      let offset = -currentSlide * window.innerWidth + swipeDeltaX;
      if (offset > 0) offset *= 0.2;
      if (offset < -1 * window.innerWidth) offset = -1 * window.innerWidth + (offset + window.innerWidth) * 0.2;
      sliderTrack.style.transform = `translateX(${offset}px)`;
    });

    window.addEventListener('mouseup', () => {
      if (!isSwiping) return;
      isSwiping = false;
      sliderTrack.classList.remove('dragging');
      const threshold = window.innerWidth * 0.16;
      if (swipeDeltaX < -threshold && currentSlide < 1) goToSlide(1);
      else if (swipeDeltaX > threshold && currentSlide > 0) goToSlide(0);
      else goToSlide(currentSlide);
      swipeDeltaX = 0;
    });

    /* ==============================================================
     * 6. 비주얼 타이머 디스크 렌더링 & 강아지 캐릭터 동기화
     * ============================================================== */
    function updateVisualDiskUI() {
      const fraction = Math.max(0, Math.min(1, timeLeft / 3600));

      const cx = 100;
      const cy = 100;
      const radius = 76;

      const angle = fraction * 360 * (Math.PI / 180);
      const endX = cx + radius * Math.sin(angle);
      const endY = cy - radius * Math.cos(angle);
      const largeArc = fraction > 0.5 ? 1 : 0;

      if (fraction <= 0.0005) {
        visualTimerDisk.setAttribute('d', 'M 100 100 Z');
        dialGuideDot.style.display = 'none';
        if (knobPointerLine) {
          knobPointerLine.setAttribute('x2', '100');
          knobPointerLine.setAttribute('y2', '82');
        }
      } else if (fraction >= 0.9995) {
        visualTimerDisk.setAttribute('d', `M ${cx} ${cy - radius} A ${radius} ${radius} 0 1 1 ${cx - 0.01} ${cy - radius} Z`);
        dialGuideDot.style.display = 'block';
        dialGuideDot.setAttribute('cx', cx);
        dialGuideDot.setAttribute('cy', cy - radius);
        if (knobPointerLine) {
          knobPointerLine.setAttribute('x2', '100');
          knobPointerLine.setAttribute('y2', '82');
        }
      } else {
        const d = `M ${cx} ${cy} L ${cx} ${cy - radius} A ${radius} ${radius} 0 ${largeArc} 1 ${endX} ${endY} Z`;
        visualTimerDisk.setAttribute('d', d);
        dialGuideDot.style.display = 'block';
        dialGuideDot.setAttribute('cx', endX);
        dialGuideDot.setAttribute('cy', endY);

        // 노브 포인터 각도 동기화
        if (knobPointerLine) {
          const kx = cx + 18 * Math.sin(angle);
          const ky = cy - 18 * Math.cos(angle);
          knobPointerLine.setAttribute('x2', kx);
          knobPointerLine.setAttribute('y2', ky);
        }
      }

      // 모드별 컬러 (공부: 클래식 레드 #C52828 / 휴식: 블루 #0284C7)
      const diskColor = currentMode === 'study' ? '#C52828' : '#0284C7';
      visualTimerDisk.setAttribute('fill', diskColor);
      dialGuideDot.setAttribute('fill', diskColor);

      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      digitalTimeText.textContent = `${m}:${s}`;

      const minsTotal = Math.ceil(timeLeft / 60);
      if (isRunning) {
        clockStatusSub.textContent = `${currentMode === 'study' ? '🔥 열공 집중 중' : '☕ 즐거운 휴식 중'} (${m}:${s})`;
        clockStatusIndicatorDot.className = currentMode === 'study' ? 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping' : 'w-2.5 h-2.5 rounded-full bg-sky-500 animate-ping';
      } else {
        clockStatusSub.textContent = `${currentMode === 'study' ? '집중 준비' : '휴식 준비'} (${minsTotal}분 세팅)`;
        clockStatusIndicatorDot.className = currentMode === 'study' ? 'w-2.5 h-2.5 rounded-full bg-rose-500' : 'w-2.5 h-2.5 rounded-full bg-sky-500';
      }
    }

    function syncDogCharacter() {
      if (currentMode === 'study') {
        clockDogStudy.classList.remove('hidden');
        clockDogStudy.classList.add('flex');
        clockDogBreak.classList.add('hidden');
        clockDogBreak.classList.remove('flex');

        timerDogStudy.classList.remove('hidden');
        timerDogStudy.classList.add('flex');
        timerDogBreak.classList.add('hidden');
        timerDogBreak.classList.remove('flex');

        headerModeBadge.className = 'text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200 shadow-sm';
        headerModeBadge.textContent = '📖 공부 모드';
        labelModeTitle.textContent = `집중 ${Math.round(timerDuration / 60)}분`;
        labelModeTitle.className = 'text-xs font-black text-rose-600';

        tabBtnStudy.className = 'flex-1 py-1.5 text-xs font-black rounded-xl bg-rose-500 text-white transition-all shadow-md';
        tabBtnBreak.className = 'flex-1 py-1.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all';
      } else {
        clockDogStudy.classList.add('hidden');
        clockDogStudy.classList.remove('flex');
        clockDogBreak.classList.remove('hidden');
        clockDogBreak.classList.add('flex');

        timerDogStudy.classList.add('hidden');
        timerDogStudy.classList.remove('flex');
        timerDogBreak.classList.remove('hidden');
        timerDogBreak.classList.add('flex');

        headerModeBadge.className = 'text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-600 border border-sky-200 shadow-sm';
        headerModeBadge.textContent = '☕ 휴식 모드';
        labelModeTitle.textContent = `휴식 ${Math.round(timerDuration / 60)}분`;
        labelModeTitle.className = 'text-xs font-black text-sky-600';

        tabBtnStudy.className = 'flex-1 py-1.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all';
        tabBtnBreak.className = 'flex-1 py-1.5 text-xs font-black rounded-xl bg-sky-500 text-white transition-all shadow-md';
      }
      updateVisualDiskUI();
    }

    function switchMode(mode) {
      if (currentMode === mode) return;
      pauseTimer();
      currentMode = mode;
      const defaultMins = mode === 'study' ? studyMinutes : breakMinutes;
      timerDuration = defaultMins * 60;
      timeLeft = timerDuration;
      syncDogCharacter();
      showToast(`${mode === 'study' ? '공부 모드' : '쉬는 시간'}로 전환되었습니다.`);
    }

    /* ==============================================================
     * 7. 다이얼 직접 터치/회전 조작 (Pointer Events)
     * ============================================================== */
    let isDialRotating = false;

    function handleDialPointerEvent(clientX, clientY) {
      const rect = analogDialSvg.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const dx = clientX - centerX;
      const dy = clientY - centerY;

      let angle = Math.atan2(dx, -dy) * (180 / Math.PI);
      if (angle < 0) angle += 360;

      let minutes = Math.round((angle / 360) * 60);
      if (minutes === 0) minutes = (angle > 180) ? 60 : 1;
      minutes = Math.max(1, Math.min(60, minutes));

      pauseTimer();
      if (currentMode === 'study') {
        studyMinutes = minutes;
      } else {
        breakMinutes = minutes;
      }
      timerDuration = minutes * 60;
      timeLeft = timerDuration;

      labelModeTitle.textContent = `${currentMode === 'study' ? '집중' : '휴식'} ${minutes}분`;
      updateVisualDiskUI();
      soundTick();
    }

    analogDialSvg.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      isDialRotating = true;
      try { analogDialSvg.setPointerCapture(e.pointerId); } catch(err) {}
      handleDialPointerEvent(e.clientX, e.clientY);
    });

    analogDialSvg.addEventListener('pointermove', (e) => {
      if (!isDialRotating) return;
      e.stopPropagation();
      handleDialPointerEvent(e.clientX, e.clientY);
    });

    function endDialRotation(e) {
      if (!isDialRotating) return;
      isDialRotating = false;
      try { analogDialSvg.releasePointerCapture(e.pointerId); } catch (err) {}
      const targetMins = Math.round(timeLeft / 60);
      showToast(`다이얼 ${targetMins}분 설정 완료! 시작 버튼을 눌러주세요.`);
    }

    analogDialSvg.addEventListener('pointerup', endDialRotation);
    analogDialSvg.addEventListener('pointercancel', endDialRotation);

    /* ==============================================================
     * 8. 화면 직접 증감 버튼 (-5, -1, +1, +5) & 프리셋 (10, 15, 30, 60)
     * ============================================================== */
    function stepAdjustMinutes(delta) {
      pauseTimer();
      const currentM = Math.floor(timeLeft / 60);
      let targetM = Math.max(1, Math.min(60, currentM + delta));

      if (currentMode === 'study') {
        studyMinutes = targetM;
      } else {
        breakMinutes = targetM;
      }
      timerDuration = targetM * 60;
      timeLeft = timerDuration;

      labelModeTitle.textContent = `${currentMode === 'study' ? '집중' : '휴식'} ${targetM}분`;
      updateVisualDiskUI();
      soundTick();
      showToast(`${targetM}분으로 조절되었습니다.`);
    }

    function setDirectPreset(minutes) {
      pauseTimer();
      const m = Math.max(1, Math.min(60, minutes));
      if (currentMode === 'study') {
        studyMinutes = m;
      } else {
        breakMinutes = m;
      }
      timerDuration = m * 60;
      timeLeft = timerDuration;

      labelModeTitle.textContent = `${currentMode === 'study' ? '집중' : '휴식'} ${m}분`;
      updateVisualDiskUI();
      soundTick();
      showToast(`${m}분으로 맞췄습니다.`);
    }

    /* ==============================================================
     * 9. 타이머 제어 루틴 (시작, 일시정지, 리셋, 완료)
     * ============================================================== */
    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (timeLeft <= 0) {
        timeLeft = timerDuration;
      }
      isRunning = true;
      btnStartPause.className = 'flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white font-black text-sm rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2';
      startIcon.textContent = '⏸';
      startText.textContent = '일시정지';
      soundStart();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateVisualDiskUI();
        } else {
          handleTimerComplete();
        }
      }, 1000);

      updateVisualDiskUI();
    }

    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      btnStartPause.className = 'flex-1 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2';
      startIcon.textContent = '▶';
      startText.textContent = '시작하기';
      soundPause();
      updateVisualDiskUI();
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = timerDuration;
      updateVisualDiskUI();
      soundTick();
      showToast('타이머가 초기화되었습니다.');
    }

    function handleTimerComplete() {
      pauseTimer();
      soundComplete();

      if (currentMode === 'study') {
        showToast('🎉 집중 시간 완료! 신나는 댄스 댕댕이와 휴식해요!');
        setTimeout(() => {
          switchMode('break');
        }, 900);
      } else {
        showToast('💪 휴식 시간 끝! 안경 댕댕이와 다시 열공해봐요!');
        setTimeout(() => {
          switchMode('study');
        }, 900);
      }
    }

    /* ==============================================================
     * 10. 토스트 알림창
     * ============================================================== */
    let toastTimeout = null;
    function showToast(msg, icon = '⏰') {
      const toast = document.getElementById('toastNotice');
      const text = document.getElementById('toastText');
      const iconEl = document.getElementById('toastIcon');
      text.textContent = msg;
      iconEl.textContent = icon;

      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2400);
    }

    /* ==============================================================
     * 11. 윈도우 로드 초기화
     * ============================================================== */
    window.addEventListener('load', () => {
      initAnalogDialFace();
      syncDogCharacter();
      updateVisualDiskUI();
    });
  </script>
</body>
